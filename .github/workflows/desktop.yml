name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      draft_release_tag:
        description: 'Optional existing draft release tag to receive verified packages; never publishes a release'
        required: false
        type: string
        default: ''
  push:
    paths:
      - 'desktop/**'
      - 'lib/optimizer.js'
      - 'public/style.css'
      - 'public/favicon.svg'
      - 'scripts/**'
      - 'tests/**'
      - 'tests/windows-selection-smoke.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'lib/optimizer.js'
      - 'public/style.css'
      - 'public/favicon.svg'
      - 'scripts/**'
      - 'tests/**'
      - 'tests/windows-selection-smoke.ps1'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.label }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: windows
            executable: win-unpacked/PromptFinch.exe
          - runner: ubuntu-22.04
            label: linux
            executable: linux-unpacked/promptfinch
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build and desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxtst-dev xvfb xauth libfuse2 libgtk-3-0 libnss3 libasound2 libgbm1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Compile selection helper
        run: node scripts/build-desktop-helpers.cjs
      - name: Check X11 right-click events and Wayland refusal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum python3 - <<'PY'
          import ctypes, json, os, select, subprocess, time
          helper = 'desktop/bin/linux/right-click-watcher'
          env = {**os.environ, 'XDG_SESSION_TYPE': 'x11'}
          probe = subprocess.run([helper, '--probe'], env=env, capture_output=True, text=True, check=True)
          assert json.loads(probe.stdout) == {'supported': True, 'protocol': 'x11'}
          rejected = subprocess.run([helper, '--probe'], env={**env, 'XDG_SESSION_TYPE': 'wayland'}, capture_output=True, text=True)
          assert rejected.returncode == 2 and json.loads(rejected.stdout)['supported'] is False
          x11 = ctypes.CDLL('libX11.so.6')
          xtst = ctypes.CDLL('libXtst.so.6')
          x11.XOpenDisplay.restype = ctypes.c_void_p
          x11.XOpenDisplay.argtypes = [ctypes.c_char_p]
          x11.XSync.argtypes = [ctypes.c_void_p, ctypes.c_int]
          x11.XCloseDisplay.argtypes = [ctypes.c_void_p]
          xtst.XTestFakeButtonEvent.argtypes = [ctypes.c_void_p, ctypes.c_uint, ctypes.c_int, ctypes.c_ulong]
          display = x11.XOpenDisplay(None)
          assert display
          watcher = subprocess.Popen([helper], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          try:
              time.sleep(0.35)
              assert watcher.poll() is None
              for pressed in [1, 0]:
                  xtst.XTestFakeButtonEvent(display, 1, pressed, 0)
              x11.XSync(display, 0)
              assert not select.select([watcher.stdout], [], [], 0.25)[0], 'Left click must not trigger the companion action'
              for pressed in [1, 0]:
                  xtst.XTestFakeButtonEvent(display, 3, pressed, 0)
              x11.XSync(display, 0)
              assert select.select([watcher.stdout], [], [], 3)[0], 'Missing right-click event'
              event = json.loads(watcher.stdout.readline())
              assert set(event) == {'event', 'x', 'y', 'capturedAt'}
              assert event['event'] == 'right-click' and abs(time.time() * 1000 - event['capturedAt']) < 1500
              assert all(isinstance(event[k], int) for k in ['x', 'y', 'capturedAt'])
              print('X11 probe, right-click observation, left-click exclusion and Wayland refusal passed.')
          finally:
              watcher.terminate()
              watcher.wait(timeout=3)
              x11.XCloseDisplay(display)
          PY
      - name: Check Windows desktop workspace
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Check Linux desktop workspace
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
      - name: Build public desktop packages
        run: npm run build:desktop -- --publish never
      - name: Verify packaged Windows workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/desktop-smoke.cjs --packaged "desktop-dist/$version/${{ matrix.executable }}"
      - name: Verify packaged Linux workspace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          xvfb-run --auto-servernum node scripts/desktop-smoke.cjs --packaged "desktop-dist/$version/${{ matrix.executable }}"
      - name: Check Windows UI Automation with synthetic selected text
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File tests/windows-selection-smoke.ps1 -HelperPath desktop/bin/win32/SelectionReader.exe -ChromePath "C:\Program Files\Google\Chrome\Application\chrome.exe"
      - name: Record public artifact hashes and build provenance
        shell: bash
        env:
          DESKTOP_BUILD_PLATFORM: ${{ matrix.label }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const output = join('desktop-dist', pkg.version);
          const files = readdirSync(output).filter(name => /\.(exe|zip|AppImage|tar\.gz)$/.test(name) && statSync(join(output, name)).isFile()).sort();
          if (files.length !== 2) throw new Error('Expected exactly two public desktop packages.');
          const artifacts = files.map(name => ({ name, bytes: statSync(join(output, name)).size,
            sha256: createHash('sha256').update(readFileSync(join(output, name))).digest('hex') }));
          const platform = process.env.DESKTOP_BUILD_PLATFORM;
          writeFileSync(join(output, `SHA256SUMS-${platform}-x64.txt`), artifacts.map(item => `${item.sha256}  ${item.name}\n`).join(''));
          writeFileSync(join(output, `PromptFinch-${pkg.version}-${platform}-x64.build.json`), JSON.stringify({
            project: 'PromptFinch', version: pkg.version, platform, architecture: 'x64',
            commit: process.env.GITHUB_SHA, workflowRun: process.env.GITHUB_RUN_ID,
            node: process.version, electron: pkg.devDependencies.electron,
            checks: ['syntax', 'unit tests', 'development workspace mock smoke', 'packaged workspace mock smoke',
              ...(platform === 'linux' ? ['X11 helper right-click event', 'Wayland refusal'] : ['Windows UI Automation synthetic selection'])],
            limitations: ['Unsigned packages', 'External application selection compatibility needs physical host testing',
              'No live model quality evaluation in this workflow', 'No ARM64 package in this workflow'], artifacts,
          }, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: PromptFinch-${{ matrix.label }}-x64
          path: |
            desktop-dist/**/*.exe
            desktop-dist/**/*.zip
            desktop-dist/**/*.AppImage
            desktop-dist/**/*.tar.gz
            desktop-dist/**/SHA256SUMS-*.txt
            desktop-dist/**/*.build.json
            !desktop-dist/**/win-unpacked/**
            !desktop-dist/**/linux-unpacked/**
          if-no-files-found: error
          retention-days: 14
  macos-development:
    name: macOS development workspace (native release unchanged)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify isolated Electron development workspace
        run: npm run test:desktop
  upload-draft:
    name: Upload verified packages to an existing draft
    needs: [desktop, macos-development]
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release_tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: PromptFinch-*-x64
          path: desktop-builds
          merge-multiple: true
      - name: Verify draft identity, artifact hashes and provenance before uploading
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = process.env.DRAFT_RELEASE_TAG;
          const repository = process.env.GITHUB_REPOSITORY;
          if (tag !== `v${version}`) throw new Error('The draft tag must exactly match the package version.');
          const gh = args => JSON.parse(execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1024 * 1024 }));
          const release = gh(['release', 'view', tag, '--repo', repository, '--json', 'isDraft,tagName']);
          if (release.isDraft !== true || release.tagName !== tag) throw new Error('Uploads require an existing draft release.');
          let object = gh(['api', `repos/${repository}/git/ref/tags/${tag}`]).object;
          for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
            object = gh(['api', `repos/${repository}/git/tags/${object.sha}`]).object;
          }
          if (object.type !== 'commit' || object.sha !== process.env.GITHUB_SHA) throw new Error('Draft tag must resolve to this exact checked commit.');
          const walk = directory => readdirSync(directory).flatMap(name => {
            const path = join(directory, name);
            return statSync(path).isDirectory() ? walk(path) : [path];
          });
          const byName = new Map();
          for (const file of walk('desktop-builds')) {
            if (byName.has(basename(file))) throw new Error('Duplicate downloaded artifact filename.');
            byName.set(basename(file), file);
          }
          const expectedPackages = {
            windows: [`PromptFinch-${version}-windows-x64-setup.exe`, `PromptFinch-${version}-windows-x64.zip`],
            linux: [`PromptFinch-${version}-linux-x64.AppImage`, `PromptFinch-${version}-linux-x64.tar.gz`],
          };
          const upload = [];
          for (const platform of ['windows', 'linux']) {
            const manifestName = `PromptFinch-${version}-${platform}-x64.build.json`;
            const sumsName = `SHA256SUMS-${platform}-x64.txt`;
            const manifestPath = byName.get(manifestName), sumsPath = byName.get(sumsName);
            if (!manifestPath || !sumsPath) throw new Error('Missing build provenance or checksums.');
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            const packages = expectedPackages[platform].sort();
            if (manifest.commit !== process.env.GITHUB_SHA || manifest.workflowRun !== process.env.GITHUB_RUN_ID
              || manifest.version !== version || manifest.platform !== platform || manifest.architecture !== 'x64'
              || !Array.isArray(manifest.artifacts) || JSON.stringify(manifest.artifacts.map(item => item.name).sort()) !== JSON.stringify(packages)) {
              throw new Error('Build provenance does not match this run, commit, version and exact package list.');
            }
            const sums = [];
            for (const artifact of manifest.artifacts) {
              const file = byName.get(artifact.name);
              if (!file || statSync(file).size !== artifact.bytes
                || createHash('sha256').update(readFileSync(file)).digest('hex') !== artifact.sha256) throw new Error('Artifact hash or size mismatch.');
              sums.push(`${artifact.sha256}  ${artifact.name}\n`);
              upload.push(file);
            }
            if (readFileSync(sumsPath, 'utf8') !== sums.join('')) throw new Error('SHA256SUMS does not match the build manifest.');
            upload.push(manifestPath, sumsPath);
          }
          if (upload.length !== 8 || byName.size !== 8) throw new Error('Expected only four packages and their four verification files.');
          // No --clobber, release creation, tag mutation, or publish operation.
          execFileSync('gh', ['release', 'upload', tag, ...upload, '--repo', repository], { stdio: 'inherit' });
          console.log('Uploaded verified Windows/Linux packages to the existing draft. The release remains unpublished.');
          JS
