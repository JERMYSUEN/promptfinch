name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:docs
      - run: npm test
      - name: Package only public source files
        run: npm run package:source -- --public-only
      - name: Verify unpacked source and isolated mock HTTP
        run: npm run check:package -- --source-only
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser and system libraries
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows with synthetic data
        run: npm run test:ui
      - name: Save failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:mac
      - name: Build public app and complete release artifacts
        run: npm run package:mac
      - name: Verify unpacked app, source, manifest, checksums and mock HTTP
        run: npm run check:package
